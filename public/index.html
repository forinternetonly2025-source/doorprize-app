<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesin Undian Doorprize</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="content">
      <div class="title-row">
        <h1>DOOR PRIZE</h1>
        <h1>NAMA PEMENANG</h1>
      </div>

      <div class="table-wrap">
        <table class="prize-table">
          <tbody id="prize-body">
            <!-- rows injected by app.js -->
          </tbody>
        </table>
      </div>
    </div>

    <div class="controls">
      <span id="status" class="status">Klik "Mulai Undian" untuk mengundi 10 doorprize secara otomatis.</span>
      <div class="buttons">
        <button id="fullscreen-btn" class="btn btn-outline">Layar Penuh</button>
        <button id="start-btn" class="btn btn-primary">Mulai Undian</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
